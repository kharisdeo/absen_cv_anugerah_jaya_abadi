  /attendance/attempts:
    post:
      tags: [Attendance]
      operationId: createAttendanceAttempt
      summary: Kirim percobaan check-in atau check-out
      description: >-
        `idempotencyKey` wajib berupa UUID. Waktu dan pilihan lokasi dari client tidak
        dipercaya; server menentukan waktu, shift, store, dan hasil validasi. Respons
        `202` berarti diterima untuk diproses; replay idempoten dapat merespons `200`.
      x-required-roles: [EMPLOYEE]
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceAttemptInput' }
      responses:
        '202':
          description: Percobaan diterima
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceAttemptReceipt' }
        '200':
          description: Hasil replay idempoten
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceAttemptReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /attendance/selfie-upload-intents:
    post:
      tags: [Attendance]
      operationId: createSelfieUploadIntent
      summary: Minta URL upload selfie privat
