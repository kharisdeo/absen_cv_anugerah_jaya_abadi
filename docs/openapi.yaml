            application/json:
              schema: { $ref: '#/components/schemas/SelfieUploadIntent' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/attendance-attempts/{attemptId}/selfie-url:
    get:
      tags: [Attendance]
      operationId: getAdminAttendanceSelfieUrl
      summary: Buat URL baca sementara untuk bukti selfie
      description: URL bertanda tangan hanya diterbitkan setelah pemeriksaan hak akses; masa berlaku dibatasi retensi.
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: URL baca sementara
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUrl' }
        default: { $ref: '#/components/responses/Problem' }
  /attendance/verifications:
