      x-required-roles: [ADMIN, SUPERVISOR, EMPLOYEE]
      parameters:
        - name: requestType
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EmployeeRequestType' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RequestStatus' }
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        '200':
          description: Halaman pengajuan; data dibatasi berdasarkan owner/reviewer scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRequestPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Requests]
      operationId: createAttendanceRequest
      summary: Ajukan izin, sakit, cuti tahunan, atau lembur
      description: CORRECTION tidak didukung endpoint ini. ID karyawan selalu dari sesi. Surat sakit opsional pada bentuk request, tetapi aturan bisnis mewajibkannya untuk SICK.
      x-required-roles: [EMPLOYEE]
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceRequestCreateInput' }
      responses:
        '201':
          description: Pengajuan dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRequest' }
        default: { $ref: '#/components/responses/Problem' }
  /attendance/requests/{requestId}:
    get:
      tags: [Requests]
      operationId: getAttendanceRequest
      summary: Detail pengajuan sesuai scope akun
      x-required-roles: [ADMIN, SUPERVISOR, EMPLOYEE]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Detail pengajuan; object key privat tidak dikembalikan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRequest' }
        default: { $ref: '#/components/responses/Problem' }
  /attendance/requests/{requestId}/attachment-url:
    get:
      tags: [Requests]
      operationId: getAttendanceRequestAttachmentUrl
      summary: Buat URL unduh sementara lampiran
      description: URL baca sementara diterbitkan hanya sesudah authorization server-side.
      x-required-roles: [ADMIN, SUPERVISOR, EMPLOYEE]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: URL unduh sementara
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUrl' }
        default: { $ref: '#/components/responses/Problem' }
  /attendance/requests/{requestId}/decision:
    post:
      tags: [Requests]
      operationId: decideAttendanceRequest
      summary: Setujui atau tolak pengajuan
      description: Supervisor hanya dapat memutus pengajuan yang lolos scope toko/jadwal; keputusan overtime memerlukan Admin.
      x-required-roles: [ADMIN, SUPERVISOR]
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestDecisionInput' }
      responses:
        '200':
          description: Pengajuan setelah keputusan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRequest' }
        default: { $ref: '#/components/responses/Problem' }

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getAdminDashboard
      summary: Ringkasan absensi Admin atau Supervisor
      x-required-roles: [ADMIN, SUPERVISOR]
      parameters:
        - name: date
          in: query
          required: false
          description: Tanggal bisnis; default ditentukan server dalam TIMEZONE.
          schema: { $ref: '#/components/schemas/Date' }
        - name: storeId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: shiftId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        '200':
          description: Summary, daftar belum check-in, trend 30 hari, dan ranking keterlambatan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }
        default: { $ref: '#/components/responses/Problem' }
  /me/dashboard:
    get:
      tags: [Dashboard]
      operationId: getEmployeeDashboard
      summary: Status shift dan riwayat karyawan sendiri
      x-required-roles: [EMPLOYEE]
      parameters:
        - name: historyPage
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: historyPageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: historyFrom
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Date' }
        - name: historyTo
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Date' }
        - name: requestPage
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: requestPageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Status hari ini, riwayat absensi dan status pengajuan sendiri
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDashboard' }
        default: { $ref: '#/components/responses/Problem' }

  /reports/monthly:
    get:
      tags: [Reports]
      operationId: getMonthlyAttendanceReport
      summary: Rekap bulanan absensi Admin atau Supervisor
      description: >-
        Satu bulan kalender per permintaan. Supervisor hanya melihat toko pada assignment session;
        filter toko/karyawan tidak dapat memperluas scope. Status koreksi belum diterapkan sampai
        workflow koreksi tersedia. workDays menghitung tanggal kerja unik per karyawan yang
        memiliki shift terjadwal non-holiday yang telah tiba/berjalan; beberapa shift pada
        tanggal yang sama dihitung satu hari, sesuai konfirmasi pemilik produk. Detail tetap
        disajikan per shift-hari.
      x-required-roles: [ADMIN, SUPERVISOR]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$', examples: ['2026-10'] }
        - name: storeId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: employeeId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ringkasan per karyawan dan detail per shift-hari
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyReport' }
        default: { $ref: '#/components/responses/Problem' }

  /reports/monthly/export:
    get:
      tags: [Reports]
      operationId: exportMonthlyAttendanceReport
      summary: Ekspor rekap bulanan menjadi workbook Excel
      description: >-
        Menghasilkan sheet Ringkasan dan Detail Harian dari aggregator yang sama dengan endpoint
        JSON. Export dicatat pada audit log; tidak menyimpan isi workbook pada audit.
      x-required-roles: [ADMIN, SUPERVISOR]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$', examples: ['2026-10'] }
        - name: storeId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: employeeId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: File XLSX yang dibatasi ke satu periode kalender
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="rekap-absensi-2026-10.xlsx"' }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Daftar notifikasi milik akun sesi
      x-required-roles: [ADMIN, SUPERVISOR, EMPLOYEE]
      parameters:
        - name: read
          in: query
          required: false
          schema: { type: string, enum: [ALL, READ, UNREAD], default: ALL }
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        '200':
          description: Halaman notifikasi dan total belum dibaca
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        default: { $ref: '#/components/responses/Problem' }
  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Tandai notifikasi milik akun sesi sebagai dibaca
      x-required-roles: [ADMIN, SUPERVISOR, EMPLOYEE]
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: ID dan waktu baca notifikasi
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, readAt]
                properties:
                  id: { type: string, format: uuid }
                  readAt: { $ref: '#/components/schemas/DateTime' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: absen_session
      description: Sesi server-side dalam cookie signed, HttpOnly, SameSite=Strict.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StoreId:
      name: storeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BindingId:
      name: bindingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HolidayId:
      name: holidayId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttendanceId:
      name: attendanceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Error response dalam format application/problem+json
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    Date:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
