openapi: 3.1.0
info:
  title: API Absensi CV Anugerah Jaya Abadi
  version: 0.1.0
  description: >-
    Kontrak machine-readable untuk route yang saat ini diregistrasikan pada
    `apps/api/src/routes`. Endpoint koreksi, penutupan bulanan, dan fitur lain yang
    belum memiliki route tidak dicantumkan sebagai API aktif. Detail
    aturan bisnis dan privasi ada di `docs/API.md`.
servers:
  - url: /api/v1
    description: Prefix API versi aktif
tags:
  - name: Health
  - name: Auth
  - name: Consent
  - name: Accounts
  - name: Employees
  - name: Stores
  - name: Devices
  - name: Schedule
  - name: Attendance
  - name: Requests
  - name: Dashboard
  - name: Reports
  - name: Notifications
  - name: Audit
  - name: System disruption
security:
  - sessionCookie: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Periksa liveness proses API
      description: Liveness proses yang tidak memeriksa database atau dependensi eksternal.
      security: []
      responses:
        '200':
          description: API tersedia; header versi hanya dikirim jika APP_VERSION dikonfigurasi
          headers:
            X-App-Version:
              description: >-
                Identifier build dari APP_VERSION. Tidak ada jika tidak dikonfigurasi; deployment
                sebaiknya mengisi ID commit immutable.
              schema:
                type: string
                maxLength: 128
                pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
        default: { $ref: '#/components/responses/Problem' }

  /ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Periksa readiness database API
      description: >-
        Mengembalikan status generik tanpa informasi koneksi. Probe tidak memerlukan sesi;
        response selalu no-store. Jika database tidak dikonfigurasi atau query readiness gagal,
        respons adalah 503.
      security: []
      responses:
        '200':
          description: Query readiness database berhasil
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
        '503':
          description: Database tidak tersedia atau query readiness gagal
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: unavailable }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Masuk dan membuat sesi
      description: Cookie sesi ditetapkan oleh server sebagai HttpOnly, signed, SameSite=Strict.
      security: []
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Login berhasil; cookie sesi disetel
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Cookie HttpOnly `absen_session`; token tidak ada di body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Ambil pengguna dari sesi aktif
      responses:
        '200':
          description: Pengguna aktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Akhiri sesi aktif
      x-requires-same-origin: true
      responses:
        '204': { description: Sesi diakhiri dan cookie dihapus }
        default: { $ref: '#/components/responses/Problem' }
  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Ganti password akun sendiri
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordInput' }
      responses:
        '200':
          description: Password diganti dan sesi baru diterbitkan
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Cookie sesi baru.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/admin/accounts/{accountId}/reset-password:
    post:
      tags: [Auth]
      operationId: adminResetAccountPassword
      summary: Atur password sementara akun
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordInput' }
      responses:
        '200':
          description: Password diubah; pengguna wajib menggantinya saat masuk
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accountId, mustChangePassword]
                properties:
                  accountId: { type: string, format: uuid }
                  mustChangePassword: { type: boolean, const: true }
        default: { $ref: '#/components/responses/Problem' }

  /consents/current:
    get:
      tags: [Consent]
      operationId: getCurrentConsentPolicy
      summary: Ambil kebijakan privasi aktif
      responses:
        '200':
          description: Kebijakan dan status persetujuan akun sesi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentCurrentResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /consents:
    post:
      tags: [Consent]
      operationId: acceptConsent
      summary: Catat persetujuan kebijakan aktif
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentAcceptInput' }
      responses:
        '200':
          description: Persetujuan tercatat atau sebelumnya telah tercatat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentAcceptResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /consents/history:
    get:
      tags: [Consent]
      operationId: listConsentHistory
      summary: Lihat riwayat persetujuan
      description: Akun non-Admin hanya dapat melihat riwayatnya sendiri.
      parameters:
        - name: accountId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Halaman riwayat consent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentHistoryPage' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Daftar akun
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: Daftar DTO akun tanpa kredensial
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Buat akun dan password sementara
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreateInput' }
      responses:
        '201':
          description: Akun dibuat; password sementara hanya dikembalikan saat pembuatan
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, temporaryPassword]
                properties:
                  account: { $ref: '#/components/schemas/Account' }
                  temporaryPassword: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /admin/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Detail akun
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: DTO akun
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Ubah data akun
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdateInput' }
      responses:
        '200':
          description: DTO akun terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/accounts/{accountId}/deactivate:
    post:
      tags: [Accounts]
      operationId: deactivateAccount
      summary: Nonaktifkan akun
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: DTO akun nonaktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: Daftar karyawan
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: Daftar karyawan
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Employees]
      operationId: createEmployee
      summary: Buat data karyawan
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCreateInput' }
      responses:
        '201':
          description: Karyawan dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/employees/{employeeId}:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [Employees]
      operationId: getEmployee
      summary: Detail karyawan
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: DTO karyawan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Employees]
      operationId: updateEmployee
      summary: Ubah data karyawan
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeUpdateInput' }
      responses:
        '200':
          description: DTO karyawan terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/employees/{employeeId}/deactivate:
    post:
      tags: [Employees]
      operationId: deactivateEmployee
      summary: Nonaktifkan karyawan
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: DTO karyawan nonaktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/stores:
    get:
      tags: [Stores]
      operationId: listStores
      summary: Daftar toko
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: Daftar toko
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Store' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Stores]
      operationId: createStore
      summary: Buat toko
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreCreateInput' }
      responses:
        '201':
          description: Toko dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/stores/{storeId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [Stores]
      operationId: getStore
      summary: Detail toko
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: DTO toko
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Stores]
      operationId: updateStore
      summary: Ubah data toko dan parameter validasi lokasi
      description: Perubahan koordinat/radius/akurasi/Wi-Fi harus dikonfirmasi Admin pada UI.
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreUpdateInput' }
      responses:
        '200':
          description: DTO toko terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/stores/{storeId}/deactivate:
    post:
      tags: [Stores]
      operationId: deactivateStore
      summary: Nonaktifkan toko
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: DTO toko nonaktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/stores/{storeId}/assignments:
    get:
      tags: [Stores]
      operationId: listStoreEmployeeAssignments
      summary: Daftar penempatan karyawan pada toko
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Daftar assignment toko-karyawan
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StoreEmployeeAssignment' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/stores/{storeId}/assignments/{employeeId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/EmployeeId'
    put:
      tags: [Stores]
      operationId: assignEmployeeToStore
      summary: Tetapkan karyawan ke toko
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      responses:
        '200':
          description: Assignment aktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreEmployeeAssignment' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Stores]
      operationId: removeEmployeeFromStore
      summary: Hapus penempatan karyawan dari toko
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      responses:
        '204': { description: Assignment dihapus }
        default: { $ref: '#/components/responses/Problem' }

  /admin/audit-logs:
    get:
      tags: [Audit]
      operationId: listAdminAuditLogs
      summary: Cari audit log secara read-only
      description: >-
        Hanya Admin dengan sesi cookie server-side. Parameter query tidak dikenal ditolak.
        from dan to bersifat inklusif dan wajib ISO timestamp berzona waktu. page dibatasi
        1-10000; pageSize dibatasi 1-100. Default rate limit 30 request per menit dan
        response memakai Cache-Control: no-store. Tidak ada route mutasi audit log.
      x-required-roles: [ADMIN]
      parameters:
        - name: actorUserAccountId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: action
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]*$'
        - name: entityType
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]*$'
        - name: entityId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: from
          in: query
          required: false
          description: Batas occurredAt paling awal, inklusif; timestamp ISO wajib menyertakan zona waktu.
          schema: { $ref: '#/components/schemas/DateTime' }
        - name: to
          in: query
          required: false
          description: Batas occurredAt paling akhir, inklusif; timestamp ISO wajib menyertakan zona waktu.
          schema: { $ref: '#/components/schemas/DateTime' }
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Halaman audit log; hanya field DTO yang diizinkan dikembalikan.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/system-disruptions:
    get:
      tags: [System disruption]
      operationId: listSystemDisruptions
      summary: Daftar gangguan sistem
      x-required-roles: [ADMIN]
      parameters:
        - name: storeId
          in: query
          required: false
          description: Memfilter gangguan untuk store ini; tanpa filter, global dan semua store disertakan.
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        '200':
          description: Halaman gangguan, termasuk gangguan global saat storeId tidak difilter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemDisruptionPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [System disruption]
      operationId: createSystemDisruption
      summary: Catat gangguan sistem
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemDisruptionCreateInput' }
      responses:
        '201':
          description: Gangguan aktif tercatat dan audit event ditambahkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemDisruption' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/device-bindings/pending:
    get:
      tags: [Devices]
      operationId: listPendingDeviceBindings
      summary: Daftar perangkat menunggu persetujuan
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: Daftar binding tanpa hash perangkat
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceBinding' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/device-bindings/{bindingId}/approve:
    post:
      tags: [Devices]
      operationId: approveDeviceBinding
      summary: Setujui binding perangkat
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/BindingId'
      responses:
        '200':
          description: Binding terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceBinding' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/device-bindings/{bindingId}/revoke:
    post:
      tags: [Devices]
      operationId: revokeDeviceBinding
      summary: Cabut binding perangkat
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/BindingId'
      responses:
        '200':
          description: Binding terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceBinding' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/shifts:
    get:
      tags: [Schedule]
      operationId: listShifts
      summary: Daftar master shift
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: Daftar shift
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkShift' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Schedule]
      operationId: createShift
      summary: Buat master shift
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkShiftCreateInput' }
      responses:
        '201':
          description: Shift dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkShift' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/shifts/{shiftId}:
    parameters:
      - $ref: '#/components/parameters/ShiftId'
    get:
      tags: [Schedule]
      operationId: getShift
      summary: Detail shift
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: DTO shift
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkShift' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Schedule]
      operationId: updateShift
      summary: Ubah master shift
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkShiftUpdateInput' }
      responses:
        '200':
          description: Shift terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkShift' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/shifts/{shiftId}/deactivate:
    post:
      tags: [Schedule]
      operationId: deactivateShift
      summary: Nonaktifkan shift
      x-required-roles: [ADMIN]
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: Shift nonaktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkShift' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/shift-assignments:
    get:
      tags: [Schedule]
      operationId: listShiftAssignments
      summary: Daftar assignment shift
      x-required-roles: [ADMIN]
      parameters:
        - name: employeeId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: storeId
          in: query
          required: false
          description: UUID toko atau `global` untuk assignment tanpa toko.
          schema: { type: string }
